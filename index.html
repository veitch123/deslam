<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deslam the News</title>
<style>
  :root { --paper: #f3f1ec; --ink: #1b2230; --muted: #5e6572; --accent: #2a6cf0; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --paper: #121519; --ink: #ece9e2; --muted: #9aa1ad; --accent: #5b95ff; } }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  main { max-width: 42rem; margin: 0 auto; padding: 48px 20px 72px; }
  h1 { font: 700 30px/1.2 ui-serif, "New York", Georgia, serif; margin: 0 0 8px; text-wrap: balance; }
  h2 { font: 700 20px/1.3 ui-serif, "New York", Georgia, serif; margin: 32px 0 6px; }
  p { margin: 0 0 14px; }
  .meta { color: var(--muted); font-size: 15px; }
  a { color: var(--accent); overflow-wrap: anywhere; }
</style>
</head>
<body><main>
<h1>Deslam the News</h1>
<p>Takes the slam out of news headlines in Safari, keeps the facts, and marks every change so you can see what the paper wrote. For iPhone, iPad and Mac.</p>
<p><a href="privacy/">Privacy policy</a></p>
</main></body>
</html>
